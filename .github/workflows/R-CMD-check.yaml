# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Some dependencies' macOS binaries link against XQuartz's X11
      # libraries (e.g. /opt/X11/lib/libXrender.1.dylib), which GitHub's macOS
      # runners do not include. Without it, loading clusterProfiler's
      # dependencies fails in dyn.load().
      - name: Install XQuartz (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # On macOS/Windows, Bioconductor's prebuilt binaries of DOSE,
      # enrichplot and clusterProfiler can come from different releases.
      # Older clusterProfiler does importFrom(DOSE, geneID), which newer DOSE
      # no longer exports, so loading it fails with "object 'geneID' is not
      # exported by 'namespace:DOSE'". All three are pure R, so install them
      # together from source to get a matching set, then check they load.
      - name: Install matching DOSE, enrichplot and clusterProfiler from source
        if: runner.os != 'Linux'
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager", repos = "https://cloud.r-project.org")
          }
          pkgs <- c("DOSE", "enrichplot", "clusterProfiler")
          BiocManager::install(pkgs, type = "source", update = FALSE, ask = FALSE, force = TRUE)
          for (p in pkgs) message(p, " ", packageVersion(p))
          suppressPackageStartupMessages(library(clusterProfiler))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
